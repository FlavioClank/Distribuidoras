<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin - {{ app_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-1">Login do Admin</h3>
          <p class="text-muted mb-3">Teste: <b>{{ admin_email }}</b> / <b>{{ admin_password }}</b></p>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, msg in messages %}
                <div class="alert {{ 'alert-danger' if category == 'error' else 'alert-success' }}">{{ msg }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post" class="vstack gap-3">
            <div>
              <label class="form-label">Email</label>
              <input class="form-control" name="email" type="email" required />
            </div>
            <div>
              <label class="form-label">Senha</label>
              <input class="form-control" name="password" type="password" required />
            </div>
            <button class="btn btn-dark">Entrar</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('public_index') }}">Voltar ao site</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
