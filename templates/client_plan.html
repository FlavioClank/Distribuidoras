{% extends "base_public.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-1">Escolha seu plano</h3>
        <p class="text-muted">Para sua empresa ficar visível no site público, é necessário ter um plano ativo.</p>

        <form method="post" class="vstack gap-2">
          <label class="border rounded p-3">
            <input type="radio" name="plan" value="basic" checked>
            <b>Básico</b> — Visibilidade + WhatsApp
          </label>

          <label class="border rounded p-3">
            <input type="radio" name="plan" value="pro">
            <b>Pro</b> — Visibilidade + WhatsApp + Relatórios
          </label>

          <button class="btn btn-dark mt-2">Continuar</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('client_dashboard') }}">Voltar</a>
        </form>

        <div class="alert alert-warning mt-3 mb-0">
          <b>Teste:</b> por enquanto a ativação é manual pelo admin. Depois entraremos com pagamento automático.
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
