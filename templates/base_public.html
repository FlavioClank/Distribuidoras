<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ app_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('public_index') }}">🔎 {{ app_name }}</a>

    <div class="d-flex gap-2">
      <a class="btn btn-outline-dark btn-sm" href="{{ url_for('client_login') }}">Sou distribuidora</a>
      <a class="btn btn-dark btn-sm" href="{{ url_for('client_register') }}">Cadastrar</a>
      <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('admin_login') }}">Admin</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  
  {% block content %}{% endblock %}
</div>

</body>
</html>
